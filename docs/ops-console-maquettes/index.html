<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cloudbreak Ops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Josefin+Sans:wght@300;400;600;700&display=swap">
<style>
  /* Visionneuse : page claire par défaut, sombre selon le thème. Les frames portent leurs propres thèmes (data-theme). */
  :root {
    --bg: #E4DED3; --fg: #1A1A1A; --muted: #5E5E5E; --line: #CFC7B8; --panel: #F2EEE6; --accent: #8A6446;
    /* Jetons des frames, thème clair (repris de l'app) */
    --cb-bg: #EFE8DC; --cb-surf: #F7F5F1; --cb-surf-2: #FBF9F5; --cb-bord: #E9E4DA; --cb-rule: rgba(26,26,26,0.08);
    --cb-acc1: #B28C6E; --cb-acc2: #D2BA9C; --cb-acc-soft: rgba(178,140,110,0.12); --cb-acc-glow: rgba(178,140,110,0.25);
    --cb-txt1: #1A1A1A; --cb-txt2: #5E5E5E; --cb-txt3: #A0A0A0; --cb-cta: #1A1A1A; --cb-cta-ink: #F7F5F1;
    --cb-card-shadow: 0 1px 2px rgba(26,26,26,0.04), 0 12px 32px -18px rgba(178,140,110,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
    --cb-high: #5C9E6E; --cb-medium: #D4904A; --cb-low: #C25C4A; --cb-none: #9E9E9E;
    --cb-high-soft: rgba(92,158,110,0.16); --cb-medium-soft: rgba(212,144,74,0.18); --cb-low-soft: rgba(194,92,74,0.18); --cb-none-soft: rgba(158,158,158,0.16);
    --cb-sk-base: rgba(26,26,26,0.07);
    --cb-font: "Josefin Sans", "Helvetica Neue", Arial, sans-serif;
    --cb-font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #131313; --fg: #F2EEE6; --muted: #A8A39A; --line: #333; --panel: #1C1C1C; --accent: #D2BA9C; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #131313; --fg: #F2EEE6; --muted: #A8A39A; --line: #333; --panel: #1C1C1C; --accent: #D2BA9C; color-scheme: dark; }

  /* Thèmes des frames */
  [data-theme="light"] { --cb-bg: #EFE8DC; --cb-surf: #F7F5F1; --cb-surf-2: #FBF9F5; --cb-bord: #E9E4DA; --cb-rule: rgba(26,26,26,0.08); --cb-acc-soft: rgba(178,140,110,0.12); --cb-acc-glow: rgba(178,140,110,0.25); --cb-txt1: #1A1A1A; --cb-txt2: #5E5E5E; --cb-txt3: #A0A0A0; --cb-cta: #1A1A1A; --cb-cta-ink: #F7F5F1; --cb-sk-base: rgba(26,26,26,0.07); --cb-card-shadow: 0 1px 2px rgba(26,26,26,0.04), 0 12px 32px -18px rgba(178,140,110,0.45), inset 0 1px 0 rgba(255,255,255,0.6); }
  [data-theme="dark"] { --cb-bg: #1A1A1A; --cb-surf: #2A2A2A; --cb-surf-2: #333333; --cb-bord: #3A3A3A; --cb-rule: rgba(247,245,241,0.08); --cb-acc-soft: rgba(178,140,110,0.14); --cb-acc-glow: rgba(178,140,110,0.22); --cb-txt1: #F7F5F1; --cb-txt2: #A0A0A0; --cb-txt3: #5E5E5E; --cb-cta: #F7F5F1; --cb-cta-ink: #1A1A1A; --cb-sk-base: rgba(247,245,241,0.09); --cb-card-shadow: 0 1px 2px rgba(0,0,0,0.5), 0 12px 32px -18px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04); --cb-high-soft: rgba(92,158,110,0.18); --cb-medium-soft: rgba(212,144,74,0.18); --cb-low-soft: rgba(194,92,74,0.18); --cb-none-soft: rgba(158,158,158,0.18); }

  /* Éléments interactifs des frames : curseur et focus clavier visibles */
  [data-theme] button, [data-theme] a[href], [data-theme] select { cursor: pointer; }
  [data-theme] button:disabled, [data-theme] [aria-disabled="true"] { cursor: default; }
  [data-theme] button:focus-visible, [data-theme] a:focus-visible, [data-theme] select:focus-visible, [data-theme] input:focus-visible { outline: 2px solid var(--cb-txt1); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { @keyframes ops-toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } } }

  /* Squelettes : balayage doux, supprimé si l'utilisateur réduit les animations */
  .ops-skel { position: relative; overflow: hidden; }
  .ops-skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent); transform: translateX(-100%); animation: ops-sweep 1.6s ease-in-out infinite; }
  [data-theme="dark"] .ops-skel::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); }
  @keyframes ops-sweep { to { transform: translateX(100%); } }
  @keyframes ops-spin { to { transform: rotate(360deg); } }
  .ops-spin { animation: ops-spin 0.8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .ops-skel::after { animation: none; display: none; } .ops-spin { animation: none; } }
  .ops-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .frame figcaption .fid { font-family: var(--cb-font-mono); font-weight: 600; font-size: 12px; color: var(--accent); margin-right: 8px; letter-spacing: 0.3px; }

  html, body { height: auto; }
  body { background: var(--bg); color: var(--fg); font-family: var(--cb-font); margin: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  .top-in { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.3px; }
  .top p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .ctrl { display: flex; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
  .seg button { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .seg button:focus-visible, .sections a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sections { display: flex; gap: 4px; overflow-x: auto; padding: 10px 0 8px; }
  .sections a { flex: 0 0 auto; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 999px; }
  .sections a:hover { color: var(--fg); background: var(--panel); }
  .wrap { max-width: 1800px; margin: 0 auto; padding-block: 8px 48px; }
  section { padding-top: 28px; scroll-margin-top: 120px; }
  section h2 { margin: 0; font-size: 22px; font-weight: 600; }
  .sub { margin: 4px 0 16px; font-size: 14.5px; color: var(--muted); max-width: 70ch; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .frame { margin: 0; min-width: 0; max-width: 100%; }
  .frame figcaption { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--fg); }
  .frame figcaption span { font-family: var(--cb-font-mono); font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 12px; }
  .frame-box { overflow: hidden; border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 10px 30px -20px rgba(0,0,0,0.4); max-width: 100%; }
  .foot { margin-top: 40px; font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="app.js"></script>

</body></html>
