<title>Suivi projet Cloudbreak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap">
<style>
/* Concept : une carte de sentier. Une ligne relie les versions de gauche (livré) à droite (plus tard) ; chaque étape porte ses fonctionnalités. */
:root {
  --bg: #EFE8DC; --surface: #F7F5F1; --line: #E3DCCD; --ink: #1A1A1A; --ink2: #5E5E5E; --ink3: #8A8478;
  --accent: #B28C6E; --accent-soft: #D2BA9C;
  --ok: #3F7D52; --ok-bg: #DDEBDD;
  --dev: #A8651F; --dev-bg: #F3E2C8;
  --wait: #7A5A3F; --wait-bg: #E8D9C8;
  --todo: #5E5E5E; --todo-bg: #E7E2D8;
  --later: #8A8478; --later-bg: #ECE7DD;
  --font: 'Josefin Sans', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1A1A; --surface: #2A2A2A; --line: #3A3A3A; --ink: #F2EEE6; --ink2: #BDB6A8; --ink3: #8F887B;
    --accent: #C9A383; --accent-soft: #6B5643;
    --ok: #7FC092; --ok-bg: #243A2C;
    --dev: #E3A769; --dev-bg: #44311B;
    --wait: #D2BA9C; --wait-bg: #3D3226;
    --todo: #BDB6A8; --todo-bg: #343434;
    --later: #8F887B; --later-bg: #2F2F2F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1A1A; --surface: #2A2A2A; --line: #3A3A3A; --ink: #F2EEE6; --ink2: #BDB6A8; --ink3: #8F887B;
  --accent: #C9A383; --accent-soft: #6B5643;
  --ok: #7FC092; --ok-bg: #243A2C;
  --dev: #E3A769; --dev-bg: #44311B;
  --wait: #D2BA9C; --wait-bg: #3D3226;
  --todo: #BDB6A8; --todo-bg: #343434;
  --later: #8F887B; --later-bg: #2F2F2F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink3); }
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.top p { color: var(--ink2); font-size: 17px; max-width: 62ch; margin-top: 6px; }
.stamp { font-size: 12px; color: var(--ink3); letter-spacing: 0.04em; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters span { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink3); margin-right: 4px; }
.chip { font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink2); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.envs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.env { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.env h3 { font-size: 18px; font-weight: 700; }
.env .sub { font-size: 13px; color: var(--ink3); margin-top: -6px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .svc { width: 64px; flex: none; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }
.row .ver { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.row .det { color: var(--ink2); font-size: 13px; min-width: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--ok); }
.dot.dev { background: var(--dev); } .dot.wait { background: var(--accent); }

.attn { display: flex; flex-direction: column; gap: 8px; }
.attn li { list-style: none; display: flex; gap: 12px; align-items: baseline; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.attn ul { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tag { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; padding: 2px 8px; border-radius: 6px; flex: none; }
.tag.wait { background: var(--wait-bg); color: var(--wait); } .tag.todo { background: var(--todo-bg); color: var(--todo); }

.trail { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; position: relative; padding-top: 22px; }
.trail::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 2px; background: repeating-linear-gradient(90deg, var(--accent-soft) 0 8px, transparent 8px 14px); }
.stop { display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; }
.stop::before { content: ""; position: absolute; top: -19px; left: 14px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 3px solid var(--accent); }
.stop.livree::before { background: var(--ok); border-color: var(--ok); }
.stop.review::before { background: var(--accent); border-color: var(--accent); }
.stop.prochaine::before { border-color: var(--dev); }
.stop-head { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.stop.livree .stop-head { border-color: var(--ok); }
.stop.review .stop-head { border-color: var(--accent); }
.stop-head .id { font-size: 26px; font-weight: 700; line-height: 1.1; }
.stop-head .ti { font-size: 15px; color: var(--ink2); }
.stop-head .meta { font-size: 12px; color: var(--ink3); letter-spacing: 0.03em; }
.pill { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; margin-top: 6px; }
.pill.livree { background: var(--ok-bg); color: var(--ok); } .pill.review { background: var(--wait-bg); color: var(--wait); }
.pill.prochaine { background: var(--dev-bg); color: var(--dev); } .pill.planifiee { background: var(--todo-bg); color: var(--todo); } .pill.plus-tard { background: var(--later-bg); color: var(--later); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.card.dim { opacity: 0.28; }
.card .t { font-weight: 600; overflow-wrap: anywhere; }
.card .d { font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
.card .n { font-size: 12px; color: var(--dev); }
.card .foot { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.st { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
.st.prod { background: var(--ok-bg); color: var(--ok); } .st.review { background: var(--wait-bg); color: var(--wait); }
.st.develop, .st.doing { background: var(--dev-bg); color: var(--dev); } .st.todo { background: var(--todo-bg); color: var(--todo); } .st.later { background: var(--later-bg); color: var(--later); }
.sv { font-size: 11px; color: var(--ink3); letter-spacing: 0.06em; text-transform: uppercase; }
.stop.livree .card { padding: 8px 12px; }
.stop.livree .card .d { display: none; }
.stop.livree .card .st { display: none; }
.stop.livree .card .t::before { content: "✓ "; color: var(--ok); }

.bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px 28px; }
.bar { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bar .l { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.bar .l b { font-weight: 600; } .bar .l span { font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 13px; }
.track { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.fill { height: 100%; border-radius: 99px; background: var(--ok); }
.fill.mid { background: var(--dev); } .fill.zero { background: transparent; }
.bar .n { font-size: 12px; color: var(--ink3); }
.err { padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

@media (max-width: 1100px) { .trail { grid-template-columns: repeat(2, minmax(0, 1fr)); } .trail::before { display: none; } .stop::before { display: none; } .trail { padding-top: 0; } }
@media (max-width: 640px) { .trail { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 28px; } .row .svc { width: 58px; } }
@media (prefers-reduced-motion: no-preference) { .card, .chip { transition: opacity .2s; } }
</style>

<div class="wrap" id="app"><div class="err">Chargement de la carte…</div></div>

<script>
(function () {
  var SVC = { mobile: 'Mobile', backend: 'Backend', ops: 'Ops' };
  var ST = { prod: 'En prod', review: 'Chez Apple', develop: 'Prêt sur develop', doing: 'En cours', todo: 'À faire', later: 'Plus tard' };
  var PILL = { livree: 'Livrée', review: 'En review Apple', prochaine: 'Prochaine', planifiee: 'Planifiée', 'plus-tard': 'Plus tard' };
  var filter = null, data = null;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    var app = document.getElementById('app');
    app.textContent = '';

    var top = el('div', 'top');
    var left = el('div');
    left.appendChild(el('h1', null, 'Cloudbreak, où on en est'));
    left.appendChild(el('p', null, data.resume));
    top.appendChild(left);
    top.appendChild(el('div', 'stamp', 'Mise à jour le ' + data.updated));
    app.appendChild(top);

    var envs = el('div', 'envs');
    data.envs.slice().reverse().forEach(function (env) {
      var c = el('div', 'env');
      c.appendChild(el('h3', null, env.nom));
      c.appendChild(el('div', 'sub', env.note));
      env.items.forEach(function (it) {
        var r = el('div', 'row');
        r.appendChild(el('span', 'dot ' + (it.etat === 'ok' ? '' : it.etat)));
        r.appendChild(el('span', 'svc', SVC[it.svc] || it.svc));
        r.appendChild(el('span', 'ver', it.version));
        r.appendChild(el('span', 'det', it.detail));
        c.appendChild(r);
      });
      envs.appendChild(c);
    });
    app.appendChild(envs);

    var attn = el('section', 'attn');
    attn.appendChild(el('h2', null, 'À surveiller'));
    var ul = el('ul');
    data.attention.forEach(function (a) {
      var li = el('li');
      li.appendChild(el('span', 'tag ' + a.niveau, a.niveau === 'wait' ? 'Attente' : 'À faire'));
      li.appendChild(el('span', null, a.texte));
      ul.appendChild(li);
    });
    attn.appendChild(ul);
    app.appendChild(attn);

    var fsec = el('section');
    var fb = el('div', 'filters');
    fb.appendChild(el('span', null, 'Filtrer'));
    [null, 'mobile', 'backend', 'ops'].forEach(function (k) {
      var b = el('button', 'chip', k ? SVC[k] : 'Tout');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(filter === k));
      b.addEventListener('click', function () { filter = k; render(); });
      fb.appendChild(b);
    });
    fsec.appendChild(fb);
    app.appendChild(fsec);

    var trail = el('div', 'trail');
    data.versions.slice().reverse().forEach(function (v) {
      var stop = el('div', 'stop ' + v.etat);
      var h = el('div', 'stop-head');
      h.appendChild(el('div', 'id', v.id));
      h.appendChild(el('div', 'ti', v.titre));
      h.appendChild(el('div', 'meta', v.date + ' · ' + v.ou));
      h.appendChild(el('span', 'pill ' + v.etat, PILL[v.etat]));
      stop.appendChild(h);
      v.features.forEach(function (f) {
        var dim = filter && f.svc.indexOf(filter) < 0;
        var c = el('div', 'card' + (dim ? ' dim' : ''));
        c.appendChild(el('div', 't', f.t));
        if (f.d) c.appendChild(el('div', 'd', f.d));
        if (f.note) c.appendChild(el('div', 'n', f.note));
        var foot = el('div', 'foot');
        foot.appendChild(el('span', 'st ' + f.etat, ST[f.etat]));
        foot.appendChild(el('span', 'sv', f.svc.map(function (s) { return SVC[s]; }).join(' · ')));
        c.appendChild(foot);
        stop.appendChild(c);
      });
      trail.appendChild(stop);
    });
    var tsec = el('section');
    tsec.style.display = 'flex'; tsec.style.flexDirection = 'column'; tsec.style.gap = '14px';
    tsec.appendChild(el('h2', null, 'La route'));
    tsec.appendChild(trail);
    app.appendChild(tsec);

    var bsec = el('section');
    bsec.style.display = 'flex'; bsec.style.flexDirection = 'column'; bsec.style.gap = '14px';
    bsec.appendChild(el('h2', null, 'Avancement par chantier (stories terminées)'));
    var bars = el('div', 'bars');
    data.chantiers.forEach(function (c) {
      var b = el('div', 'bar');
      var l = el('div', 'l');
      l.appendChild(el('b', null, c.nom));
      l.appendChild(el('span', null, c.fait + ' / ' + c.total));
      b.appendChild(l);
      var tr = el('div', 'track');
      var pct = c.total ? Math.round(100 * c.fait / c.total) : 0;
      var fl = el('div', 'fill' + (pct === 100 ? '' : pct === 0 ? ' zero' : ' mid'));
      fl.style.width = pct + '%';
      tr.appendChild(fl);
      b.appendChild(tr);
      if (c.note) b.appendChild(el('div', 'n', c.note));
      bars.appendChild(b);
    });
    bsec.appendChild(bars);
    app.appendChild(bsec);
  }

  fetch('roadmap.json').then(function (r) { return r.json(); }).then(function (j) { data = j; render(); })
    .catch(function () { document.getElementById('app').textContent = 'Impossible de charger roadmap.json.'; });
})();
</script>
